<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 980 600" width="980" height="600" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <title>DropBridge 界面示意图</title>
  <desc>左侧是贴边的悬浮条，里面是四个文件夹图标；右侧是文件资源管理器窗口。</desc>

  <defs>
    <g id="fi">
      <path d="M0,3 A3,3 0 0 1 3,0 L15,0 L21,5 L41,5 A3,3 0 0 1 44,8 L44,28 A3,3 0 0 1 41,31 L3,31 A3,3 0 0 1 0,28 Z" fill="#EFB03A" stroke="#D99524" stroke-width="0.6"/>
      <path d="M0,13 L44,13 L44,28 A3,3 0 0 1 41,31 L3,31 A3,3 0 0 1 0,28 Z" fill="#F8C862"/>
    </g>
    <clipPath id="winClip">
      <rect x="158" y="36" width="802" height="468" rx="10"/>
    </clipPath>
  </defs>

  <rect x="10" y="10" width="960" height="520" rx="12" fill="#DCE3EC" stroke="#C2CBD6" stroke-width="1"/>

  <rect x="158" y="36" width="802" height="468" rx="10" fill="#FFFFFF" stroke="#C7D0DB" stroke-width="1"/>

  <g clip-path="url(#winClip)">
    <rect x="158" y="36" width="802" height="36" fill="#EDF0F4"/>
    <text x="176" y="58" font-size="12" fill="#3A3A3A">文件资源管理器</text>
    <rect x="898" y="49" width="10" height="10" rx="2" fill="none" stroke="#9AA5B1" stroke-width="1"/>
    <rect x="918" y="49" width="10" height="10" rx="2" fill="none" stroke="#9AA5B1" stroke-width="1"/>
    <path d="M936,54 L948,54 M942,49 L942,59" stroke="#9AA5B1" stroke-width="1"/>

    <rect x="158" y="72" width="802" height="36" fill="#F6F8FA"/>
    <path d="M182,86 L174,92 L182,98" fill="none" stroke="#7B8794" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M204,86 L212,92 L204,98" fill="none" stroke="#B4BCC6" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="228" y="78" width="532" height="24" rx="5" fill="#FFFFFF" stroke="#DDE3EA" stroke-width="1"/>
    <text x="240" y="94" font-size="11" fill="#6B7280">此电脑 〉 项目 〉 素材</text>
    <line x1="158" y1="108" x2="960" y2="108" stroke="#E3E8EF" stroke-width="1"/>

    <g>
      <use xlink:href="#fi" href="#fi" transform="translate(247,136) scale(0.8)"/>
      <text x="265" y="181" font-size="11" fill="#3A3A3A" text-anchor="middle">素材</text>
      <use xlink:href="#fi" href="#fi" transform="translate(397,136) scale(0.8)"/>
      <text x="415" y="181" font-size="11" fill="#3A3A3A" text-anchor="middle">参考图</text>
      <use xlink:href="#fi" href="#fi" transform="translate(547,136) scale(0.8)"/>
      <text x="565" y="181" font-size="11" fill="#3A3A3A" text-anchor="middle">输出</text>
      <use xlink:href="#fi" href="#fi" transform="translate(697,136) scale(0.8)"/>
      <text x="715" y="181" font-size="11" fill="#3A3A3A" text-anchor="middle">脚本</text>

      <use xlink:href="#fi" href="#fi" transform="translate(247,218) scale(0.8)"/>
      <text x="265" y="263" font-size="11" fill="#3A3A3A" text-anchor="middle">贴图</text>
      <use xlink:href="#fi" href="#fi" transform="translate(397,218) scale(0.8)"/>
      <text x="415" y="263" font-size="11" fill="#3A3A3A" text-anchor="middle">模型</text>
      <use xlink:href="#fi" href="#fi" transform="translate(547,218) scale(0.8)"/>
      <text x="565" y="263" font-size="11" fill="#3A3A3A" text-anchor="middle">文档</text>
      <use xlink:href="#fi" href="#fi" transform="translate(697,218) scale(0.8)"/>
      <text x="715" y="263" font-size="11" fill="#3A3A3A" text-anchor="middle">备份</text>

      <use xlink:href="#fi" href="#fi" transform="translate(247,300) scale(0.8)"/>
      <text x="265" y="345" font-size="11" fill="#3A3A3A" text-anchor="middle">归档</text>
      <use xlink:href="#fi" href="#fi" transform="translate(397,300) scale(0.8)"/>
      <text x="415" y="345" font-size="11" fill="#3A3A3A" text-anchor="middle">临时</text>
      <use xlink:href="#fi" href="#fi" transform="translate(547,300) scale(0.8)"/>
      <text x="565" y="345" font-size="11" fill="#3A3A3A" text-anchor="middle">待整理</text>
      <use xlink:href="#fi" href="#fi" transform="translate(697,300) scale(0.8)"/>
      <text x="715" y="345" font-size="11" fill="#3A3A3A" text-anchor="middle">交付</text>
    </g>
  </g>

  <rect x="26" y="36" width="118" height="468" rx="12" fill="none" stroke="#93A1B0" stroke-width="1" stroke-dasharray="5 4"/>

  <g>
    <rect x="38" y="53" width="94" height="96" rx="10" fill="#FFFFFF" fill-opacity="0.78"/>
    <use xlink:href="#fi" href="#fi" transform="translate(63,67)"/>
    <text x="85" y="125" font-size="11" fill="#111111" text-anchor="middle">素材</text>

    <rect x="38" y="166" width="94" height="96" rx="10" fill="#FFFFFF" fill-opacity="0.78"/>
    <use xlink:href="#fi" href="#fi" transform="translate(63,180)"/>
    <text x="85" y="238" font-size="11" fill="#111111" text-anchor="middle">参考图</text>

    <rect x="38" y="279" width="94" height="96" rx="10" fill="#FFFFFF" fill-opacity="0.78"/>
    <use xlink:href="#fi" href="#fi" transform="translate(63,293)"/>
    <text x="85" y="351" font-size="11" fill="#111111" text-anchor="middle">贴图</text>

    <rect x="38" y="392" width="94" height="96" rx="10" fill="#FFFFFF" fill-opacity="0.78"/>
    <use xlink:href="#fi" href="#fi" transform="translate(63,406)"/>
    <text x="85" y="464" font-size="11" fill="#111111" text-anchor="middle">模型</text>
  </g>

  <text x="10" y="556" font-size="13" fill="#57606A">拖动文件夹到侧边区域即生成悬浮图标；双击图标打开文件夹，拖回资源管理器即移动 / 复制。</text>
  <text x="10" y="580" font-size="13" fill="#57606A">悬浮条只在资源管理器位于前台、且未最大化时出现 —— 切到别的程序立刻隐藏。</text>
</svg>
